version: '3.8'



services:
  db:
    image: postgres:15
    container_name: order_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: order_service
    environment:
      SERVER_PORT: ":8080"
      DB_USER: "user"
      DB_PASSWORD: "password"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "orders"
      SSL_MODE: "disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
          condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: